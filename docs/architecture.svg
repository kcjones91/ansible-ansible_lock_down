<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcf2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="localGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="linuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e95420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7f50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a4ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fba00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Azure CIS Hardening with Ansible Lockdown
  </text>
  
  <!-- Local Workstation Box -->
  <rect x="30" y="70" width="260" height="220" rx="12" fill="url(#localGrad)" filter="url(#shadow)"/>
  <text x="160" y="100" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    🖥️ Windows Workstation
  </text>
  
  <!-- Terraform -->
  <rect x="50" y="115" width="100" height="50" rx="6" fill="#7b42bc"/>
  <text x="100" y="145" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Terraform</text>
  
  <!-- Docker/Ansible -->
  <rect x="170" y="115" width="100" height="50" rx="6" fill="#2496ed"/>
  <text x="220" y="140" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Docker</text>
  <text x="220" y="155" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">(Ansible)</text>
  
  <!-- group_vars -->
  <rect x="50" y="180" width="100" height="50" rx="6" fill="#ffc107"/>
  <text x="100" y="200" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="bold">group_vars/</text>
  <text x="100" y="215" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="9">linux.yml</text>
  <text x="100" y="226" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="9">windows.yml</text>
  
  <!-- inventory.ini -->
  <rect x="170" y="180" width="100" height="50" rx="6" fill="#28a745"/>
  <text x="220" y="200" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">inventory.ini</text>
  <text x="220" y="215" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9">(auto-generated)</text>
  
  <!-- Roles box -->
  <rect x="50" y="245" width="220" height="35" rx="6" fill="#e83e8c"/>
  <text x="160" y="267" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📦 Ansible Lockdown Roles</text>

  <!-- Azure Cloud Box -->
  <rect x="350" y="70" width="520" height="300" rx="12" fill="url(#azureGrad)" filter="url(#shadow)"/>
  <text x="610" y="100" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    ☁️ Azure Cloud
  </text>
  
  <!-- Resource Group -->
  <rect x="370" y="115" width="480" height="240" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="610" y="138" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12">Resource Group: rg-demo-vms</text>
  
  <!-- VNET -->
  <rect x="390" y="150" width="440" height="190" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-dasharray="5,5"/>
  <text x="610" y="170" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11">Virtual Network: 10.0.0.0/16</text>
  
  <!-- Linux VM -->
  <rect x="420" y="190" width="180" height="130" rx="8" fill="url(#linuxGrad)" filter="url(#shadow)"/>
  <text x="510" y="220" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28">🐧</text>
  <text x="510" y="250" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Ubuntu 22.04</text>
  <text x="510" y="268" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">vm-linux-demo</text>
  <rect x="440" y="280" width="140" height="25" rx="4" fill="rgba(0,0,0,0.3)"/>
  <text x="510" y="297" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">SSH :22</text>
  
  <!-- Windows VM -->
  <rect x="630" y="190" width="180" height="130" rx="8" fill="url(#winGrad)" filter="url(#shadow)"/>
  <text x="720" y="220" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28">🪟</text>
  <text x="720" y="250" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Windows Server 2022</text>
  <text x="720" y="268" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">vm-win-demo</text>
  <rect x="650" y="280" width="140" height="25" rx="4" fill="rgba(0,0,0,0.3)"/>
  <text x="720" y="297" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">WinRM :5985</text>
  
  <!-- Arrows -->
  <!-- Terraform to Azure -->
  <path d="M 150 140 Q 250 100 370 140" stroke="#7b42bc" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="260" y="100" fill="#7b42bc" font-family="Arial, sans-serif" font-size="10">terraform apply</text>
  
  <!-- Docker to Linux -->
  <path d="M 270 140 L 420 220" stroke="#2496ed" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="320" y="165" fill="#2496ed" font-family="Arial, sans-serif" font-size="9">SSH</text>
  
  <!-- Docker to Windows -->
  <path d="M 270 140 L 630 220" stroke="#2496ed" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="410" y="155" fill="#2496ed" font-family="Arial, sans-serif" font-size="9">WinRM</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b42bc"/>
    </marker>
  </defs>
  
  <!-- Workflow Steps at Bottom -->
  <rect x="30" y="400" width="840" height="180" rx="12" fill="rgba(255,255,255,0.05)"/>
  <text x="450" y="430" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Workflow Steps
  </text>
  
  <!-- Step 1 -->
  <rect x="50" y="450" width="180" height="110" rx="8" fill="#e3f2fd"/>
  <text x="140" y="480" text-anchor="middle" fill="#1565c0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1️⃣ Infrastructure</text>
  <text x="140" y="505" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">terraform init</text>
  <text x="140" y="520" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">terraform apply</text>
  <text x="140" y="545" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">Creates VMs + inventory</text>
  
  <!-- Step 2 -->
  <rect x="255" y="450" width="180" height="110" rx="8" fill="#fff3e0"/>
  <text x="345" y="480" text-anchor="middle" fill="#e65100" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2️⃣ Ansible Setup</text>
  <text x="345" y="505" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">docker compose build</text>
  <text x="345" y="520" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">.\setup.cmd</text>
  <text x="345" y="545" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">Downloads roles</text>
  
  <!-- Step 3 -->
  <rect x="460" y="450" width="180" height="110" rx="8" fill="#e8f5e9"/>
  <text x="550" y="480" text-anchor="middle" fill="#2e7d32" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3️⃣ Configure</text>
  <text x="550" y="505" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">Edit group_vars/</text>
  <text x="550" y="520" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">linux.yml | windows.yml</text>
  <text x="550" y="545" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">Enable/disable rules</text>
  
  <!-- Step 4 -->
  <rect x="665" y="450" width="180" height="110" rx="8" fill="#fce4ec"/>
  <text x="755" y="480" text-anchor="middle" fill="#c2185b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">4️⃣ Harden</text>
  <text x="755" y="505" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">.\ansible.cmd playbook</text>
  <text x="755" y="520" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">cis-hardening-all.yml</text>
  <text x="755" y="545" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="9">Apply CIS benchmarks</text>
  
  <!-- Arrows between steps -->
  <path d="M 230 505 L 255 505" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 435 505 L 460 505" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 640 505 L 665 505" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
